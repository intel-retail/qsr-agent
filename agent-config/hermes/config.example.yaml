# Reusable Hermes runtime settings for this project. Copy required values into
# ~/.hermes/config.yaml and replace the repository path. MCP endpoints are kept
# separately because local simulations and production services use different
# transports and trust boundaries.
#
# provider: "custom" is Hermes' setting for any OpenAI-compatible endpoint
# (OVMS, vLLM, llama.cpp, Ollama). OVMS runs without auth, so api_key is a
# non-empty placeholder only to satisfy the OpenAI client.
#
# context_length note: current Hermes requires a >=64000-token window; the model
# supports 262144, but OVMS KV cache (--cache_size) bounds the usable window.
model:
  # Set MODEL_ID in .env.example; the same value is served by OVMS.
  default: ${MODEL_ID}
  provider: custom
  base_url: http://127.0.0.1:4444/v3
  api_key: "local-ovms-no-auth"
  context_length: 64000
  # Keep outputs short: generation time scales with tokens emitted, and long
  # tool-driven answers dominate operator latency.
  max_tokens: 1536
  # Stream tokens so the operator UI can render the answer as it is generated
  # instead of waiting for the whole turn. The operator UI relays the gateway's stream.
  streaming: true

# Per-endpoint overrides for the custom (OVMS) provider.
# extra_body disables Qwen3's "thinking" mode for hybrid models; Instruct-2507
# is non-thinking and ignores it. Hermes forwards extra_body to OVMS per request.
providers:
  custom:
    base_url: http://127.0.0.1:4444/v3
    request_timeout_seconds: 1800
    stale_timeout_seconds: 1800
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

agent:
  max_turns: 500
  run_budget_seconds: 1800
  tool_use_enforcement: "true"
  session_stall_timeout: 900
  # Fewer planning tokens per turn; the local model is latency-bound.
  reasoning_effort: low

tools:
  tool_search:
    enabled: false

skills:
  external_dirs:
    - /absolute/path/to/qsr-agentic-svc/qsr-skills