# Remote / external MCP services registered with Hermes.
# setup.sh merges this file, so add real remote endpoints here. A service whose
# URL is empty is not registered. Put TLS/authentication at a reverse proxy on
# each service host.

mcp_servers:
  # Suspicious Activity (kitchen food safety). SAD runs its own MCP service via
  # `make up` in the storewide-loss-prevention repo (streamable-http on :9000).
  suspicious-activity:
    url: ${QSR_SAD_MCP_URL}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 120

  loss-prevention:
    url: ${QSR_LP_MCP_URL}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 120

  # Order Accuracy, one MCP server per venue format (streamable-http).
  order-accuracy-take-away:
    url: ${QSR_ORDER_ACCURACY_TAKE_AWAY_MCP_URL}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 120

  order-accuracy-dine-in:
    url: ${QSR_ORDER_ACCURACY_DINE_IN_MCP_URL}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 120

  # Kiosk operations (smart-kiosk-assistant: queue, menu, kiosk settings).
  # The name `kiosk` is the agent's built-in kiosk capability.
  kiosk:
    url: ${QSR_KIOSK_MCP_URL}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 120

  # Weather (store-location conditions) from services/weather, run as the compose
  # `weather` service or by setup.sh on the host.
  # QSR_WEATHER_MCP_URL may point at a real-weather deployment; empty removes it.
  weather:
    url: ${QSR_WEATHER_MCP_URL}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 60

  # Digital Signage (product-detection-driven advertising). Runs as the web-ui
  # container's in-process MCP server (streamable-http on :5100), but that port
  # is NOT published directly on the digital-signage host - all access goes
  # through its TLS-terminating nginx proxy instead (see that repo's
  # docs/user-guide/how-to-guides/use-mcp-agent-tools.md). nginx's cert is
  # self-signed by default (nginx-cert-gen.sh); entrypoint.py's
  # trust_remote_mcp_certs() fetches and trusts it automatically at startup, so
  # no manual cert setup is needed for the default same-host deployment below.
  # Cross-machine deployment: set QSR_DIGITAL_SIGNAGE_MCP_URL to the real host
  # (host.docker.internal only resolves to THIS container's own host) - the
  # digital-signage box's own HOST_IP must also be set to its real reachable IP
  # so its cert's SAN list actually covers that address.
  digital-signage:
    url: ${QSR_DIGITAL_SIGNAGE_MCP_URL:-https://host.docker.internal:5000/mcp}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 120

  # EdgeMart café-day sim (customers, orders, tables, queue) from the
  # qsr-store-pos-agent repo's `store-activity-service-mcp` compose service
  # (streamable-http on :3101). See that repo's backend/src/store-activity-service/STORE-ACTIVITY-SERVICE.md.
  store-activity-service:
    url: ${EDGEMART_SIM_MCP_URL:-http://host.docker.internal:3101/mcp}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 60
    headers:
      X-Api-Key: ${EDGEMART_MCP_API_KEY:-}

  # EdgeMart table occupancy & cleaning sim, same repo's `table-occupancy-service-mcp`
  # compose service (streamable-http on :3201).
  table-occupancy-service:
    url: ${EDGEMART_TABLE_SIM_MCP_URL:-http://host.docker.internal:3201/mcp}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 60
    headers:
      X-Api-Key: ${EDGEMART_MCP_API_KEY:-}

  # EdgeMart footfall/movement sim (read-only), same repo's
  # `footfall-service-mcp` compose service (streamable-http on :3301).
  footfall-service:
    url: ${EDGEMART_FOOTFALL_SIM_MCP_URL:-http://host.docker.internal:3301/mcp}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 60
    headers:
      X-Api-Key: ${EDGEMART_MCP_API_KEY:-}

  # Template — copy for a remote, authenticated service on another host:
  # your-service:
  #   url: https://your-service.example.internal/mcp
  #   transport: streamable-http
  #   enabled: true
  #   connect_timeout: 15
  #   timeout: 120
  #   headers:
  #     Authorization: Bearer ${YOUR_SERVICE_MCP_TOKEN}