# Remote / external MCP services registered with Hermes.
# setup.sh merges this file, so add real remote endpoints here. Local simulation
# services are auto-discovered from tests/mcp-services/*_server.py and must NOT
# be listed here. Put TLS/authentication at a reverse proxy on each service host.

mcp_servers:
  # Suspicious Activity (kitchen food safety). SAD runs its own MCP service via
  # `make up` in the storewide-loss-prevention repo (streamable-http on :9000).
  suspicious-activity:
    url: http://127.0.0.1:9000/mcp
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 120

  # Weather (store-location conditions) from services/weather, run as the compose
  # `weather` service or by setup.sh on the host.
  # QSR_WEATHER_MCP_URL may point at a real-weather deployment; empty removes it.
  weather:
    url: ${QSR_WEATHER_MCP_URL}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 60

  # Digital Signage (product-detection-driven advertising). Runs as the web-ui
  # container's in-process MCP server (streamable-http on :5100); port is
  # published on the digital-signage host via docker-compose.yml.
  digital-signage:
    url: ${QSR_DIGITAL_SIGNAGE_MCP_URL:-http://host.docker.internal:5100/mcp}
    transport: streamable-http
    enabled: true
    connect_timeout: 15
    timeout: 120

  # Template — copy for a remote, authenticated service on another host:
  # your-service:
  #   url: https://your-service.example.internal/mcp
  #   transport: streamable-http
  #   enabled: true
  #   connect_timeout: 15
  #   timeout: 120
  #   headers:
  #     Authorization: Bearer ${YOUR_SERVICE_MCP_TOKEN}