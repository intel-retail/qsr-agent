<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a5c"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>

  <!-- Actors -->
  <rect x="20" y="90" width="170" height="70" rx="8" fill="#f4f6f8" stroke="#3c4a5c"/>
  <text x="105" y="120" text-anchor="middle" font-weight="600">Store operator</text>
  <text x="105" y="140" text-anchor="middle" fill="#555">web browser</text>

  <rect x="20" y="270" width="170" height="70" rx="8" fill="#f4f6f8" stroke="#3c4a5c"/>
  <text x="105" y="298" text-anchor="middle" font-weight="600">Event producers</text>
  <text x="105" y="318" text-anchor="middle" fill="#555">queue, orders, sensors</text>

  <!-- Edge system -->
  <rect x="230" y="40" width="470" height="370" rx="12" fill="#e9f3fb" stroke="#0068b5" stroke-width="2"/>
  <text x="465" y="66" text-anchor="middle" font-weight="700" fill="#0068b5">Intel® edge system (Docker Compose)</text>

  <rect x="260" y="90" width="180" height="80" rx="8" fill="#ffffff" stroke="#0068b5"/>
  <text x="350" y="118" text-anchor="middle" font-weight="600">Operator UI  :8600</text>
  <text x="350" y="138" text-anchor="middle" fill="#555">chat, decisions,</text>
  <text x="350" y="155" text-anchor="middle" fill="#555">approvals, learning</text>

  <rect x="490" y="90" width="180" height="80" rx="8" fill="#ffffff" stroke="#0068b5"/>
  <text x="580" y="118" text-anchor="middle" font-weight="600">Hermes agent</text>
  <text x="580" y="138" text-anchor="middle" fill="#555">skills, memory,</text>
  <text x="580" y="155" text-anchor="middle" fill="#555">tool orchestration</text>

  <rect x="490" y="235" width="180" height="95" rx="8" fill="#0068b5" stroke="#0068b5"/>
  <text x="580" y="262" text-anchor="middle" font-weight="600" fill="#ffffff">OpenVINO™ Model Server</text>
  <text x="580" y="282" text-anchor="middle" fill="#ffffff">Qwen3-30B-A3B (INT4)</text>
  <text x="580" y="310" text-anchor="middle" font-weight="600" fill="#ffffff">Intel® GPU</text>

  <rect x="260" y="250" width="180" height="60" rx="8" fill="#ffffff" stroke="#0068b5"/>
  <text x="350" y="276" text-anchor="middle" font-weight="600">Weather service</text>
  <text x="350" y="295" text-anchor="middle" fill="#555">simulator or Open-Meteo</text>

  <text x="465" y="390" text-anchor="middle" fill="#555">All inference and store data stay on-premises</text>

  <!-- Store services -->
  <rect x="740" y="90" width="200" height="240" rx="8" fill="#f4f6f8" stroke="#3c4a5c"/>
  <text x="840" y="118" text-anchor="middle" font-weight="600">Store services (MCP)</text>
  <text x="760" y="150" fill="#333">• Kiosk</text>
  <text x="760" y="175" fill="#333">• Order accuracy</text>
  <text x="760" y="200" fill="#333">• Kitchen safety</text>
  <text x="760" y="225" fill="#333">• Digital signage</text>
  <text x="760" y="250" fill="#333">• Tables and footfall</text>
  <text x="760" y="275" fill="#333">• Your service</text>
  <text x="840" y="312" text-anchor="middle" fill="#555" font-size="12">local or remote</text>

  <!-- Flows -->
  <line x1="190" y1="125" x2="258" y2="125" stroke="#3c4a5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="190" y1="300" x2="298" y2="172" stroke="#3c4a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="222" fill="#3c4a5c" font-size="12">events</text>
  <line x1="350" y1="250" x2="350" y2="172" stroke="#3c4a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="215" fill="#3c4a5c" font-size="12">weather events</text>
  <line x1="440" y1="130" x2="488" y2="130" stroke="#3c4a5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="580" y1="170" x2="580" y2="233" stroke="#3c4a5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="586" y="206" fill="#3c4a5c" font-size="12">reasoning</text>
  <line x1="505" y1="170" x2="442" y2="262" stroke="#3c4a5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="200" fill="#3c4a5c" font-size="12">MCP</text>
  <line x1="670" y1="130" x2="738" y2="130" stroke="#3c4a5c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="704" y="122" text-anchor="middle" fill="#3c4a5c" font-size="12">MCP</text>
</svg>
