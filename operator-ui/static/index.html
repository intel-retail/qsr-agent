<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QSR Store Agent — Operator</title>
  <style>
    :root { --bg:#0f1720; --panel:#161f2b; --side:#121a24; --line:#26364a; --me:#2563eb; --bot:#1f2a37; --txt:#e6edf3; --muted:#93a4b8; --ok:#22c55e; }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); display:grid; grid-template-columns:280px 1fr; height:100vh; }

    aside { background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
    aside .brand { padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    aside .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); flex:0 0 auto; }
    aside .brand h1 { font-size:15px; margin:0; font-weight:600; }
    aside .section { padding:14px 16px 6px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; justify-content:space-between; }
    aside .count { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:1px 8px; font-size:11px; color:var(--txt); }
    #services { list-style:none; margin:0; padding:6px 10px; overflow-y:auto; flex:1; }
    #services li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; margin-bottom:6px; background:var(--panel); border:1px solid var(--line); font-size:13px; }
    #services li .s-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
    #services li.up .s-dot { background:var(--ok); }
    #services li.down .s-dot { background:#ef4444; }
    #services li .s-name { font-weight:600; }
    #services li .s-meta { margin-left:auto; font-size:11px; color:var(--muted); }
    #services .empty { color:var(--muted); background:transparent; border:0; padding:10px 12px; }
    aside .foot { padding:12px 16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; display:flex; align-items:center; }
    aside .refresh { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:11px; cursor:pointer; }
    aside .refresh:hover { border-color:var(--me); color:var(--txt); }

    main { display:flex; flex-direction:column; min-width:0; height:100vh; }
    main header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    main header h2 { font-size:15px; margin:0; font-weight:600; }
    main header .sub { color:var(--muted); font-size:12px; margin-left:auto; }
    #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:760px; padding:10px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.45; font-size:14px; }
    .me { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:3px; }
    .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:3px; }
    .bot.err { border-color:#7f1d1d; color:#fecaca; }
    .quick { display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 10px; }
    .quick button { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; }
    .quick button:hover { border-color:var(--me); }
    form { display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line); background:var(--panel); }
    #q { flex:1; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; outline:none; }
    #q:focus { border-color:var(--me); }
    button.send { background:var(--me); color:#fff; border:0; border-radius:10px; padding:0 18px; font-weight:600; cursor:pointer; }
    button.send:disabled { opacity:.5; cursor:not-allowed; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:s .8s linear infinite; vertical-align:middle; }
    @keyframes s { to { transform:rotate(360deg); } }
    @media (max-width:720px) { body { grid-template-columns:1fr; } aside { display:none; } }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <span class="dot"></span>
      <h1>QSR Store Agent</h1>
    </div>
    <div class="section">
      <span>Connected apps</span>
      <span class="count" id="count">…</span>
    </div>
    <ul id="services"><li class="empty">Loading…</li></ul>
    <div class="foot">
      <button class="refresh" id="refresh">Refresh</button>
      <span style="margin-left:8px;">Hermes · Qwen3 · MCP</span>
    </div>
  </aside>

  <main>
    <header>
      <h2>Operator Chat</h2>
      <span class="sub" id="status">ready</span>
    </header>

    <div id="chat">
      <div class="bot msg">Hi — I'm your store agent. Ask me about kitchen food safety, kiosk, or order accuracy. I answer from the live MCP services.</div>
    </div>

    <div class="quick" id="quick"></div>

    <form id="form">
      <input id="q" autocomplete="off" placeholder="Ask the store agent…" />
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const q = document.getElementById('q');
    const send = document.getElementById('send');
    const quick = document.getElementById('quick');
    const services = document.getElementById('services');
    const count = document.getElementById('count');
    const status = document.getElementById('status');
    const refresh = document.getElementById('refresh');

    async function loadServers() {
      services.innerHTML = '<li class="empty">Loading…</li>';
      count.textContent = '…';
      try {
        const res = await fetch('/servers');
        const data = await res.json();
        const list = (data.ok && data.servers) ? data.servers : [];
        count.textContent = list.length;
        if (list.length === 0) {
          services.innerHTML = '<li class="empty">No services connected</li>';
        } else {
          services.innerHTML = '';
          list.forEach(name => {
            const li = document.createElement('li');
            li.dataset.name = name;
            li.innerHTML = '<span class="s-dot"></span><span class="s-name"></span><span class="s-meta"></span>';
            li.querySelector('.s-name').textContent = name;
            services.appendChild(li);
          });
          loadStatus();
        }
      } catch (err) {
        count.textContent = '!';
        services.innerHTML = '<li class="empty">Status unavailable</li>';
      }
    }

    async function loadStatus(force) {
      try {
        const res = await fetch('/status' + (force ? '?force=1' : ''));
        const data = await res.json();
        const svc = (data.ok && data.services) ? data.services : {};
        services.querySelectorAll('li[data-name]').forEach(li => {
          const s = svc[li.dataset.name];
          const meta = li.querySelector('.s-meta');
          if (!s) { li.classList.remove('up', 'down'); if (meta) meta.textContent = ''; return; }
          li.classList.toggle('up', !!s.ok);
          li.classList.toggle('down', !s.ok);
          if (meta) meta.textContent = s.ok ? (s.tools + ' tools') : 'offline';
        });
      } catch (err) { /* leave dots neutral */ }
    }

    refresh.onclick = () => { loadServers(); loadStatus(true); };
    loadServers();
    setInterval(() => loadStatus(false), 30000);

    const SUGGESTIONS = [
      "List all suspicious-activity zones",
      "Show anything dropped on the floor and put back in the food area. How often, and which station?",
      "How many high-severity food-safety events are there?",
      "What is our order accuracy rate right now?",
      "How deep is the kiosk queue?"
    ];

    SUGGESTIONS.forEach(text => {
      const b = document.createElement('button');
      b.textContent = text.length > 46 ? text.slice(0, 44) + '…' : text;
      b.title = text;
      b.onclick = () => { q.value = text; q.focus(); };
      quick.appendChild(b);
    });

    function add(role, text, isErr) {
      const el = document.createElement('div');
      el.className = 'msg ' + (role === 'me' ? 'me' : 'bot') + (isErr ? ' err' : '');
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = q.value.trim();
      if (!question) return;
      add('me', question);
      q.value = '';
      send.disabled = true;
      status.textContent = 'thinking…';
      const pending = add('bot', '');
      pending.innerHTML = '<span class="spin"></span> thinking…';
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        if (data.ok) {
          pending.textContent = data.answer;
        } else {
          pending.classList.add('err');
          pending.textContent = 'Error: ' + (data.error || 'unknown');
        }
      } catch (err) {
        pending.classList.add('err');
        pending.textContent = 'Request failed: ' + err;
      } finally {
        send.disabled = false;
        status.textContent = 'ready';
        q.focus();
      }
    });

    q.focus();
  </script>
</body>
</html>
