[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsr-deployer"
version = "0.1.0"
description = "MCP service that clones, builds and starts QSR services on remote Linux nodes over SSH, from a YAML inventory"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.0,<5", "paramiko>=3.5,<6", "PyYAML>=6,<7"]

[project.scripts]
qsr-deployer = "deployer.__main__:main"

[tool.setuptools.packages.find]
include = ["deployer*"]

[tool.setuptools.package-data]
deployer = ["*.sh"]
