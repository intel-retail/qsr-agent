[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-simulator"
version = "0.1.0"
description = "Weather MCP service with an operator-controlled simulator and an Open-Meteo backend"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.0,<5"]

[project.scripts]
weather-simulator = "weather_simulator.__main__:main"

[tool.setuptools.packages.find]
include = ["weather_simulator*"]
